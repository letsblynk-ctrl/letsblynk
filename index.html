<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLYNK Warteliste</title>
<meta name="description" content="BLYNK: Weniger schreiben. Mehr erleben. München und Frankfurt, ab April 2027. Nur auf Bewerbung.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="BLYNK · Let's blynk tonight.">
<meta property="og:description" content="Weniger schreiben. Mehr erleben. München und Frankfurt, ab April 2027. Nur auf Bewerbung.">
<meta property="og:image" content="https://letsblynk.com/media/teaser_poster.jpg">
<meta property="og:image" content="https://letsblynk.com/media/portrait-900.jpg">
<meta property="og:url" content="https://letsblynk.com/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Hanken Grotesk";font-weight:400;font-display:swap;src:url(media/fonts/HankenGrotesk-Regular.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:500;font-display:swap;src:url(media/fonts/HankenGrotesk-Medium.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:600;font-display:swap;src:url(media/fonts/HankenGrotesk-SemiBold.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:800;font-display:swap;src:url(media/fonts/Poppins-ExtraBold.ttf) format("truetype")}

/* Layout: Porträt im roten Licht als volle Bildhälfte (Desktop links, Handy oben), daneben Satz, Countdown und Warteliste. Kein Text über dem Foto. Nur ein dunkles Erscheinungsbild, wie App und Markenbuch. */
:root{
 --night:#000; --raised:#121212; --raised2:#1c1c1c;
 --fg:#fff; --soft:#d9d4ce; --muted:#9d968f;
 --wine:#6e1220; --bone:#f3eadb; --err:#ff9c9c;
 --display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
 --ui:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

img,video{max-width:100%;display:block}
a{color:inherit}
.w{position:relative;z-index:1;width:100%;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}

header{position:sticky;top:0;z-index:20;background:#000;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(243,234,219,.14)}
header .w{display:flex;align-items:center;height:60px}
.wm{width:96px;height:auto}
.lang{margin-left:auto;font:inherit;font-size:11px;font-weight:600;letter-spacing:.2em;background:none;color:var(--soft);border:1px solid rgba(243,234,219,.25);border-radius:999px;padding:7px 12px;cursor:pointer;transition:border-color .2s,color .2s}
.lang:hover{border-color:var(--bone);color:var(--bone)}

main{flex:1}
.portrait{position:fixed;inset:0;z-index:0;margin:0;overflow:hidden;pointer-events:none}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;animation:fade 1.8s cubic-bezier(.23,1,.32,1) .1s both}
@keyframes fade{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@media (min-width:901px){
 .portrait{left:auto;width:62vw;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
 .portrait img{object-position:60% 28%}
 @keyframes fade{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
}
main{display:flex;align-items:center}
main .w{display:grid;grid-template-columns:minmax(0,640px);justify-content:center;justify-items:center;row-gap:clamp(32px,6vh,52px);padding-block:clamp(28px,7vh,72px)}
.intro{width:100%}
.card{width:100%;max-width:420px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;font-size:clamp(46px,13vw,76px);color:var(--bone)}
.line{white-space:nowrap}
.lede{margin:16px 0 0;font-size:clamp(16px,1.5vw,18px);line-height:1.5;color:var(--soft);max-width:30em}
.line{display:block;overflow:hidden;padding-bottom:.1em}
.line>span{display:block;animation:rise .9s cubic-bezier(.23,1,.32,1) both}
.line:nth-child(2)>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(105%)}}
/* Das BLYNK-Auge: pulsiert und blinzelt */
.eye{display:block;width:clamp(44px,11vw,58px);height:auto;margin:0 auto 20px;overflow:visible;filter:drop-shadow(0 0 5px rgba(140,22,42,.45))}
.eye .lid{transform-box:fill-box;transform-origin:50% 30%;animation:blink 5.2s cubic-bezier(.65,0,.35,1) 1.2s infinite}
@keyframes blink{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.06)}94%{transform:scaleY(1)}}

/* Mehr erleben: Buchstaben kommen einzeln aus der Unschärfe und rücken zusammen */
h1.lux{position:relative;isolation:isolate;color:var(--bone);display:inline-block}
h1.lux .ch{display:inline-block;white-space:pre;opacity:0;filter:blur(14px);transform:translateY(.12em);animation:chin 1.3s cubic-bezier(.23,1,.32,1) forwards}
@keyframes chin{to{opacity:1;filter:blur(0);transform:none}}
h1.lux .word{display:inline-block;animation:track 2.2s cubic-bezier(.23,1,.32,1) both}
@keyframes track{from{letter-spacing:.14em}to{letter-spacing:-.03em}}
/* Countdown: läuft sekundengenau */
.timer{display:flex;justify-content:center;align-items:flex-start;gap:clamp(5px,1.6vw,10px);margin-top:26px}
.unit{display:grid;justify-items:center;gap:6px}
.digits{display:flex;gap:3px}
.dg{position:relative;min-width:clamp(22px,6.4vw,30px);height:clamp(34px,9.6vw,44px);border-radius:7px;background:linear-gradient(#151515,#0a0a0a);border:1px solid rgba(243,234,219,.14);font-family:var(--display);font-weight:800;font-size:clamp(18px,5.2vw,26px);line-height:clamp(32px,9.2vw,42px);color:var(--bone);text-align:center;font-variant-numeric:tabular-nums;overflow:hidden}
.dg span{display:block}
.dg.tick span{animation:tick .45s cubic-bezier(.23,1,.32,1)}
@keyframes tick{from{transform:translateY(-70%);opacity:0}}
.unit small{font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sep{font-family:var(--display);font-weight:800;font-size:clamp(16px,4.6vw,22px);line-height:clamp(34px,9.6vw,44px);color:rgba(243,234,219,.35)}
.timer-note{margin:12px 0 0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

.card{position:relative;isolation:isolate;overflow:hidden;background:#050505;border:1px solid rgba(243,234,219,.16);border-radius:28px;padding:clamp(24px,3.4vw,40px)}
.card::before{content:"";position:absolute;inset:-20%;z-index:-1;background:radial-gradient(85% 60% at 50% 0%,rgba(168,26,50,.9),rgba(110,18,32,.45) 45%,transparent 78%),radial-gradient(80% 50% at 50% 100%,rgba(130,20,38,.75),rgba(110,18,32,.2) 50%,transparent 80%);animation:cardpulse 4.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes cardpulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.card h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1;margin:0 0 18px}
.sub{margin:0 0 22px;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:28px;margin-bottom:20px;border-bottom:1px solid rgba(243,234,219,.14)}
.seg button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:0 0 12px;margin-bottom:-1px;border-bottom:1px solid transparent;cursor:pointer;transition:color .15s,border-color .15s}
.seg button:hover{color:var(--soft)}
.seg button[aria-pressed="true"]{color:var(--bone);border-bottom-color:var(--bone)}
form,.grp{display:grid;gap:16px}
label{display:grid;gap:4px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input,select{font:inherit;font-size:17px;letter-spacing:0;text-transform:none;color:var(--fg);background:transparent;border:0;border-bottom:1px solid rgba(243,234,219,.22);border-radius:0;padding:6px 0 8px;width:100%;outline:none;-webkit-appearance:none;appearance:none;min-width:0;transition:border-color .2s}
input::placeholder{color:#5f5a55}
select{background-image:linear-gradient(45deg,transparent 50%,#9d968f 50%),linear-gradient(135deg,#9d968f 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 4px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:24px}
select option{background:#111;color:#fff}
input:focus,select:focus{border-bottom-color:var(--bone)}
label:focus-within{color:var(--bone)}
[aria-invalid="true"]{border-bottom-color:var(--err)!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:340px){.row{grid-template-columns:1fr}}
.ok{display:flex;gap:12px;align-items:flex-start;font-size:12.5px;font-weight:400;letter-spacing:0;text-transform:none;line-height:1.45;color:var(--muted);margin-top:2px}
.ok input{width:18px;height:18px;flex:0 0 18px;padding:0;border:1px solid rgba(243,234,219,.4);border-radius:50%;margin-top:1px;cursor:pointer;display:grid;place-content:center}
.ok input:checked{background:var(--bone);border-color:var(--bone)}
.ok input:checked::after{content:"";width:8px;height:4px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.ok a{color:var(--soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send{font:inherit;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:var(--bone);color:#000;border:0;border-radius:999px;height:56px;cursor:pointer;margin-top:6px;transition:transform .12s cubic-bezier(.23,1,.32,1),background-color .2s}
.send:hover{background:#fff}
.send:active{transform:scale(.98)}
.send[disabled]{opacity:.6;cursor:default}
.err{color:var(--err);font-size:13px;margin:0}
.err:empty{display:none}
.done{display:grid;gap:14px}
.done p{margin:0;color:var(--soft)}
.invite{display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(243,234,219,.22);padding:4px 0 10px}
.invite code{font-family:var(--ui);font-size:14px;overflow-wrap:anywhere;flex:1;min-width:0;color:var(--bone)}
.invite button{font:inherit;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:none;color:var(--fg);border:1px solid rgba(243,234,219,.4);border-radius:999px;height:36px;padding:0 14px;cursor:pointer}
.invite button:hover{border-color:var(--bone)}
.note{font-size:13px;color:var(--muted)}

footer .w{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--fg)}
/* Intro: Staub formt das BLYNK-Auge, glüht, zerstiebt, die Seite öffnet sich wie ein Lid */
#intro{position:fixed;inset:0;z-index:100;background:#000;cursor:pointer;--rx:0px;--ry:0px}
#intro.open{-webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at 50% 46%,transparent 0 92%,#000 100%);mask-image:radial-gradient(ellipse var(--rx) var(--ry) at 50% 46%,transparent 0 92%,#000 100%)}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro button{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8f8882;background:none;border:0;padding:10px;cursor:pointer}
#intro button:hover{color:#f3eadb}
body.intro-on{overflow:hidden}
body.intro-on .portrait img,body.intro-on h1.lux *,body.intro-on /* Komposition: Text links, Gesicht rechts, damit nichts im Gesicht liegt */
.intro{text-align:left}
h1.lux{text-align:left}
.intro .eye{margin:0 0 18px}
.timer{justify-content:flex-start}
.timer-note{text-align:left}
main .w{justify-content:start!important;justify-items:start!important}
.card{max-width:420px}
@media (max-width:900px){
 main .w{grid-template-columns:minmax(0,1fr)!important}
 h1.lux .word{display:inline-block}
 .intro,h1.lux{text-align:center}
 .intro .eye{margin:0 auto 10px;width:40px}
 .timer{justify-content:center}
 .timer-note{text-align:center}
 main .w{justify-items:center!important;justify-content:center!important;padding-block:12px 28px!important;row-gap:22px!important}
}
@media (min-width:600px) and (max-width:900px){
 h1.lux{font-size:clamp(56px,8vw,72px)}
}
@media (max-width:599px){
 h1.lux{font-size:clamp(38px,11vw,46px);line-height:1}
 .card{max-width:none}
}
@media (min-width:901px){
 main .w{grid-template-columns:minmax(0,480px)!important;padding-left:max(48px,7vw)!important;margin:0;row-gap:28px!important;padding-block:32px 40px!important}
 header .w,footer .w{max-width:none;padding-left:max(48px,7vw);padding-right:max(48px,7vw)}
 h1.lux{font-size:clamp(56px,5.6vw,84px)!important;line-height:.98}
 h1.lux .word{display:block}
}
/* Kopfzeile: Logo, kleiner Satz mit blinzelndem Auge, Sprache */
header .w{position:relative}
.claim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;white-space:nowrap}
header .eye{width:18px!important;margin:0!important;filter:drop-shadow(0 0 3px rgba(140,22,42,.5))}
header h1.lux{font-family:var(--ui)!important;font-size:11px!important;font-weight:600;letter-spacing:.3em!important;text-transform:uppercase;line-height:1;color:var(--bone);text-align:left}
header h1.lux .word{display:inline-block!important;animation:none}
header h1.lux .ch{filter:blur(6px)}
@media (max-width:420px){.claim{gap:7px}header h1.lux{letter-spacing:.2em!important;font-size:10px!important}.wm{width:80px}}

/* Großer Timer auf Höhe des Gesichts */
.timer{margin-top:0!important;gap:clamp(5px,1.6vw,12px)}
.digits{gap:4px}
.dg{min-width:clamp(30px,8.4vw,52px)!important;height:clamp(46px,12.6vw,76px)!important;font-size:clamp(28px,7.6vw,48px)!important;line-height:clamp(44px,12.2vw,74px)!important;border-radius:clamp(8px,2vw,12px)!important;background:rgba(10,10,10,.82)!important}
.sep{font-size:clamp(22px,6vw,36px)!important;line-height:clamp(46px,12.6vw,76px)!important}
.unit small{font-size:10px;margin-top:2px}
.timer-note{font-size:12px!important;margin-top:16px!important}
@media (max-width:900px){main .w{padding-block:clamp(110px,19vh,190px) 28px!important;row-gap:clamp(36px,6vh,56px)!important}}
@media (min-width:901px){main .w{grid-template-columns:minmax(0,560px)!important;row-gap:40px!important}}
/* Timer liegt auf den Augen, Hinweis und Warteliste rücken dicht heran */
.timer-note{margin-top:8px!important}
main .w{row-gap:20px!important}
@media (min-width:901px){
 .portrait{left:16vw;right:16vw;width:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
 .portrait img{object-position:62% 30%}
 main .w{grid-template-columns:minmax(0,560px)!important;justify-content:center!important;justify-items:center!important;padding-left:16px!important;margin:0 auto!important;padding-block:var(--top,180px) 40px!important}
 .intro,.timer-note{text-align:center}
 .timer{justify-content:center}
 header .w,footer .w{max-width:1160px;margin:0 auto}
}
@media (min-width:600px) and (max-width:900px){main .w{padding-top:clamp(90px,12vh,150px)!important}}
/* Timer oberhalb der Augen, Warteliste direkt unterhalb: Lage wird per Skript aus dem Bild berechnet */
main{align-items:flex-start!important}
main .w{padding-top:var(--padtop,24px)!important}
.card{margin-top:var(--cardgap,0px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Blinzelndes Auge neben dem Titel der Warteliste */
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.cardhead h2{margin:0!important}
.cardeye{width:30px!important;margin:0!important;flex:none;filter:drop-shadow(0 0 4px rgba(150,22,44,.55))}
/* bis München und Frankfurt: dünn, gesperrt, zwischen zwei Haarlinien */
.timer-note{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px!important;font-size:10px!important;font-weight:400;letter-spacing:.36em!important;white-space:nowrap;text-transform:uppercase;color:var(--bone)!important;opacity:.86;padding-left:.46em}
.timer-note::before,.timer-note::after{content:"";height:1px;width:clamp(18px,6vw,64px);background:linear-gradient(90deg,transparent,rgba(243,234,219,.6))}
.timer-note::after{background:linear-gradient(90deg,rgba(243,234,219,.6),transparent)}
/* Lesbarkeit auf dem hellen Bild, ohne das Bild abzudunkeln */
.unit small,.timer-note{text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.6)}
.timer-note::before,.timer-note::after{box-shadow:0 0 6px rgba(0,0,0,.8)}
.dg{box-shadow:0 6px 18px rgba(0,0,0,.45)}
footer{position:relative;z-index:2;background:#000;border-top:1px solid rgba(243,234,219,.14)}
/* Menüzeile: weicher Verlauf von Schwarz ins Bild statt harter Kante */
header{background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.92) 45%,rgba(0,0,0,.55) 72%,rgba(0,0,0,0) 100%)!important;border-bottom:0!important;padding-bottom:34px}
main{margin-top:-34px}
/* Desktop und iPad quer: weinroter Verlauf an den Seiten statt schwarzer Balken */
@media (min-width:901px){
 body{background:
  radial-gradient(60% 75% at 0% 55%,rgba(150,24,44,.85),rgba(110,18,32,.45) 45%,transparent 75%),
  radial-gradient(60% 75% at 100% 55%,rgba(150,24,44,.85),rgba(110,18,32,.45) 45%,transparent 75%),
  linear-gradient(90deg,#2a0509 0%,#000 26%,#000 74%,#2a0509 100%)!important;background-attachment:fixed!important}
 .portrait{-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 24%,#000 76%,transparent 100%)!important;mask-image:linear-gradient(90deg,transparent 0%,#000 24%,#000 76%,transparent 100%)!important}
}
/* Instagram in der Menüzeile */
.social{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:999px;border:1px solid rgba(243,234,219,.25);color:var(--soft);transition:border-color .2s,color .2s}
.social:hover{border-color:var(--bone);color:var(--bone)}
.social svg{width:16px;height:16px}
.igfoot{display:inline-flex;align-items:center;gap:6px}
.igfoot svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
